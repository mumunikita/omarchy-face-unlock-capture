# Example Howdy configuration. The installer only changes device_path,
# timeout and abort_if_lid_closed, preserving your other values and comments.
[core]
# Show progress messages for each face scan attempt.
detection_notice = false

# Suppress success confirmation after facial authentication.
no_confirmation = false

# Skip facial authentication when session uses SSH.
abort_if_ssh = true

# Skip facial authentication while laptop lid is closed.
abort_if_lid_closed = true

# Disable Howdy PAM authentication without removing enrolled models.
disabled = false

[video]
# Maximum seconds allowed for one facial authentication scan.
timeout = 4

# Camera device path; prefer a stable /dev/v4l/by-path entry.
device_path = /dev/v4l/by-id/usb-Example_IR_Camera-video-index0

# Show warning when configured camera cannot be opened.
warn_no_device = true

# Limit processed frame height to trade image detail for speed.
max_height = 320

# Requested camera width; -1 selects default or largest profile.
frame_width = -1

# Requested camera height; -1 selects default or largest profile.
frame_height = -1

# Enable CLAHE preprocessing for low-contrast camera frames.
clahe_enabled = true

# CLAHE contrast clip limit for low-contrast frames.
clahe_clip_limit = 1.25

# CLAHE grid size used to process each camera frame.
clahe_tile_grid_size = 8

# Reject frames whose darkest histogram bin exceeds this percentage.
dark_threshold = 75

# Force OpenCV to decode camera frames as MJPEG.
force_mjpeg = false

# Camera exposure value; -1 leaves automatic exposure enabled.
exposure = -1

# Camera frame rate; 0 leaves selection to camera backend.
device_fps = 0

# Camera orientation mode: 0 landscape, 1 both, 2 portrait.
rotate = 0

[face]
# YuNet face detector score threshold.
yunet_score_threshold = 0.8845

# YuNet detector non-maximum suppression threshold.
yunet_nms_threshold = 0.3

# Maximum number of YuNet detections retained for matching.
yunet_top_k = 1000

# SFace distance metric used to compare face embeddings.
sface_metric = cosine

# SFace match threshold; valid range depends on selected metric.
sface_threshold = 0.6942

[debug]
# Print timing details after authentication.
end_report = false
